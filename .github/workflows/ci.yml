name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -v --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t benefitiq:ci .

      - name: Smoke test - container starts and /health answers
        run: |
          docker run -d --name bq -p 8000:8000 -e EMBEDDING_PROVIDER=fake -e AWS_REGION=us-east-1 benefitiq:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && exit 0; sleep 2; done
          docker logs bq; exit 1
