# Start everything:   docker compose up --build
# API  -> http://localhost:8000/docs
# UI   -> http://localhost:8501
# The ./data folder on your laptop is shared with the containers, so run the
# download / generate / ingest scripts once (locally or with `docker compose run`) first.
services:
  api:
    build: .
    image: benefitiq:latest
    # .env is injected as real environment variables, so boto3 sees AWS_BEARER_TOKEN_BEDROCK
    # (or AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) and AWS_REGION directly.
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  ui:
    build: .                 # same image as the api (Docker reuses the cached layers)
    image: benefitiq:latest
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000   # service name "api" is the hostname on the compose network
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0",
              "--server.headless", "true"]
    ports:
      - "8501:8501"
    healthcheck:
      disable: true
    restart: unless-stopped
